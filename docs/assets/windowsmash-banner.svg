<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="430" viewBox="0 0 1280 430" role="img" aria-labelledby="title description">
  <title id="title">WindowSmash</title>
  <desc id="description">An experimental Windows native porting toolkit. AArch64 becomes C, then native x64.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#101c36"/><stop offset="1" stop-color="#070d1c"/></linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#5eead4"/><stop offset="1" stop-color="#818cf8"/></linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#7b93c5" stroke-opacity=".07"/></pattern>
  </defs>
  <rect width="1280" height="430" rx="20" fill="url(#bg)"/>
  <rect width="1280" height="430" rx="20" fill="url(#grid)"/>
  <path d="M0 428H1280" stroke="url(#accent)" stroke-width="4"/>
  <circle cx="1130" cy="55" r="190" fill="#6366f1" opacity=".05"/>
  <circle cx="1020" cy="220" r="148" fill="none" stroke="#818cf8" stroke-opacity=".15"/>
  <circle cx="1020" cy="220" r="108" fill="none" stroke="#5eead4" stroke-opacity=".1"/>
  <g transform="translate(66 65)">
    <rect width="65" height="65" rx="16" fill="#17283f" stroke="#5eead4" stroke-opacity=".65"/>
    <path d="M15 16H32V33H15ZM36 16H50V33H36ZM15 37H32V50H15ZM36 37H50V50H36Z" fill="url(#accent)"/>
    <text x="84" y="27" font-family="Segoe UI,Arial,sans-serif" font-size="13" font-weight="700" letter-spacing="3" fill="#7dd3fc">NATIVE PORTING TOOLKIT</text>
    <text x="84" y="52" font-family="Consolas,monospace" font-size="13" fill="#93a4c7">WINDOWS x64 / DIRECT3D 11</text>
  </g>
  <text x="65" y="217" font-family="Segoe UI,Arial,sans-serif" font-size="76" font-weight="750" letter-spacing="-3" fill="#f2f6ff">Window<tspan fill="#7ddedb">Smash</tspan></text>
  <text x="69" y="259" font-family="Segoe UI,Arial,sans-serif" font-size="21" fill="#a8b8d7">Static recompilation. Native execution. Built to be understood.</text>
  <g transform="translate(69 313)" font-family="Consolas,monospace" font-size="15">
    <rect width="121" height="42" rx="8" fill="#142a3b" stroke="#5eead4" stroke-opacity=".5"/><text x="60" y="27" text-anchor="middle" fill="#99f6e4">AArch64</text>
    <path d="M136 21H172M166 15L172 21L166 27" fill="none" stroke="#6b7f9e" stroke-width="2"/>
    <rect x="188" width="89" height="42" rx="8" fill="#17213c" stroke="#818cf8" stroke-opacity=".6"/><text x="232" y="27" text-anchor="middle" fill="#c7d2fe">C</text>
    <path d="M292 21H328M322 15L328 21L322 27" fill="none" stroke="#6b7f9e" stroke-width="2"/>
    <rect x="344" width="150" height="42" rx="8" fill="#17213c" stroke="#818cf8" stroke-opacity=".6"/><text x="419" y="27" text-anchor="middle" fill="#c7d2fe">native x64</text>
  </g>
  <g transform="translate(869 141)">
    <rect width="305" height="176" rx="14" fill="#0e172a" stroke="#334568"/>
    <path d="M0 34H305" stroke="#334568"/>
    <circle cx="18" cy="17" r="4" fill="#5eead4"/><circle cx="33" cy="17" r="4" fill="#818cf8"/><circle cx="48" cy="17" r="4" fill="#47597b"/>
    <g font-family="Consolas,monospace" font-size="15"><text x="23" y="69" fill="#7dd3fc">guest code</text><text x="23" y="98" fill="#b6c6e6">+ native runtime</text><text x="23" y="127" fill="#b6c6e6">+ your game data</text><text x="23" y="156" fill="#5eead4">→ Windows executable</text></g>
  </g>
  <text x="1175" y="385" text-anchor="end" font-family="Consolas,monospace" font-size="12" letter-spacing="2" fill="#8094ba">EXPERIMENTAL · SOURCE TOOLKIT</text>
</svg>
